image: python:3.10

stages:
  - deploy

publish_to_pypi:
  stage: deploy
  tags:
    - shared_docker
  script:
    - |
      git fetch origin main
      if ! git merge-base --is-ancestor $CI_COMMIT_SHA origin/main; then
        echo "ERROR: This tag is not on the main branch. Aborting."
        exit 1
      fi
    - pip install build twine
    - python -m build
    - twine upload dist/*
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/