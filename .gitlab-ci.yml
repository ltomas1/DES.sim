image: python:3.10

stages:
  - test
  - deploy

run_tests:
  stage: test
  tags:
    - shared_docker
  script:
    # Install your package and the [dev] dependencies (which includes pytest)
    - pip install ".[dev]"
    - pytest unit_testing/ -v

publish_to_pypi:
  stage: deploy
  tags:
    - shared_docker
  script:
    - |
      git fetch origin main
      if ! git merge-base --is-ancestor $CI_COMMIT_SHA origin/main; then
        echo "ERROR: This tag is not on the main branch. Aborting."
        exit 1
      fi
    - pip install build twine
    - python -m build
    - twine upload dist/*
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/